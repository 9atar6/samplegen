[project]
name = "samplegen"
version = "0.1.0"
description = "Local AI sample generator for sound design and music (Stable Audio 3 + Foundation-1 via ComfyUI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "numpy>=2.0",
    "soundfile>=0.12",
    "soxr>=0.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["samplegen"]
